[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulsewatch"
version = "0.1.0"
description = "Service health and SLO monitor"
requires-python = ">=3.11"
dependencies = [
    "prometheus_client>=0.20",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "dnspython>=2.6",
]

[project.scripts]
pulsewatch = "pulsewatch.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pulsewatch"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PTH"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pulsewatch --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["ignore::pytest.PytestDeprecationWarning"]
